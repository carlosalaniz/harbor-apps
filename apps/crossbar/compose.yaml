services:
  app:
    image: ghcr.io/carlosalaniz/crossbar-app@sha256:fccd042bbf03e908c8ee108220bbb90c6b49e71fbb59abbb4e47eed665863f31 # tag: 0.1.2
    environment:
      CROSSBAR_BROWSER_URL: http://browser:9300
      CROSSBAR_DATA: /data
    volumes:
      - {type: volume, source: app-data, target: /data}
    depends_on:
      browser:
        condition: service_started
  browser:
    image: ghcr.io/carlosalaniz/crossbar-browser@sha256:52a8cf2f8b35dc9b38d67b2378a06c20f89dca766702559484e796784c9c9103 # tag: 0.1.2
    environment:
      CROSSBAR_PROXY: http://proxy:3128
      CROSSBAR_PROFILES: /profiles
    volumes:
      - {type: volume, source: profiles, target: /profiles}
    depends_on:
      proxy:
        condition: service_started
  proxy:
    image: ghcr.io/carlosalaniz/crossbar-proxy@sha256:804f88a39b7f0fe0cdbad3c96436ddd8a75661d260c57727f51136b89d58bfac # tag: 0.1.2
volumes:
  app-data: {}
  profiles: {}
