services:
  backend:
    image: ghcr.io/kittendevv/invio-backend@sha256:f8be7b258ab9ba8c6305dffc755b1b1bec61d6b9e78a96db594f20414e03c60f # tag: v2.4.0
    environment:
      ADMIN_USER: admin
      SESSION_TTL_SECONDS: "43200"
      SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "true"
      DATABASE_PATH: /app/data/invio.db
    volumes:
      - {type: volume, source: data, target: "/app/data"}
  frontend:
    image: ghcr.io/kittendevv/invio-frontend@sha256:e76eb76a040edc75c6c7aba6859ea051c195ca76ab93291e41efea2aadd13d28 # tag: v2.4.0
    environment:
      PORT: "8000"
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: "false"
      FRONTEND_SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "false"
    depends_on:
      backend:
        condition: service_started
volumes:
  data: {}
