services:
  db:
    # PostgreSQL 15, the version upstream's own compose file runs
    image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 # tag: 15.19-alpine
    environment:
      POSTGRES_DB: "ghostfolio"
      POSTGRES_USER: "ghostfolio"
    healthcheck:
      # Over TCP: the temporary server of the first initialisation only listens on its socket
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ghostfolio, -d, ghostfolio]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db-data, target: /var/lib/postgresql/data}
  redis:
    # Cache and job queues only: nothing in it is real data, so it never persists
    image: redis@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537 # tag: 8.10.3-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: ghostfolio/ghostfolio@sha256:713016ce4fe8e862c09f0e0c12731c0656f9c39dd46d6edbc1c20dd73e2d7808 # tag: 3.94.0
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # Every start runs the Prisma CLI through npx (migrate, seed): no usage telemetry to
      # checkpoint.prisma.io, and no npm version check against the registry
      CHECKPOINT_DISABLE: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    # No container healthcheck: the first start migrates the database for a while, and Harbor's own
    # check of /api/v1/health (manifest health:) waits for it
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  db-data: {}
