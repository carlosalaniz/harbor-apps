services:
  web:
    image: ghcr.io/fccview/jotty@sha256:5295d8a85aada46519ed6a1822d5989a373583f42017a346e8a62b44d75af71a # tag: 1.29.2
    environment:
      NODE_ENV: production
    volumes:
      - {type: volume, source: app, target: "/app/data"}
      - {type: volume, source: config, target: "/app/config"}
      - {type: volume, source: cache, target: "/app/.next/cache"}
volumes:
  app: {}
  config: {}
  cache: {}
