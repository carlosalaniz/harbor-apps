services:
  app:
    image: wordpress@sha256:8901759bfbb7ebc567dbc44a244c0d96d720d0a67c17bc4f42ec355ddba2e863 # tag: 7.1.3
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: umbrel
      WORDPRESS_DB_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: wordpress, target: "/var/www/html"}
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c # tag: 11.8.8
    environment:
      MYSQL_ROOT_PASSWORD: umbrelwordpressroot
      MYSQL_DATABASE: wordpress
      MYSQL_USER: umbrel
      MYSQL_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  wordpress: {}
  db: {}
