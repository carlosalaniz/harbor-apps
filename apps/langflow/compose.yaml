services:
  app:
    image: langflowai/langflow@sha256:4cfba8c49c4dba081964f9096bc8b9169f99f7c720000a9563a2fd1296a35e9f # tag: 1.13.2
    environment:
      LANGFLOW_CONFIG_DIR: /app/langflow
      HOME: /app/langflow
      DO_NOT_TRACK: "true"
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_DATABASE_URL: postgresql://langflow:langflow@db:5432/langflow
      # Langflow refuses private addresses for model providers by default (SSRF protection). The ollama link's
      # provider answers as ollama-link (Harbor decision 126) on a private network; allow that one host only.
      LANGFLOW_SSRF_ALLOWED_HOSTS: ollama-link
    volumes:
      - {type: volume, source: app, target: "/app/langflow"}
  db:
    image: postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # tag: 16.15-trixie
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
