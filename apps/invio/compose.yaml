services:
  backend:
    image: ghcr.io/kittendevv/invio-backend@sha256:af231d8c50a19564a658f9da596b5af25255d2e8cba23430b26fa2403bcc945f # tag: v2.3.1
    environment:
      ADMIN_USER: admin
      SESSION_TTL_SECONDS: "43200"
      SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "true"
      DATABASE_PATH: /app/data/invio.db
    volumes:
      - {type: volume, source: data, target: "/app/data"}
  frontend:
    image: ghcr.io/kittendevv/invio-frontend@sha256:47832e1ffd794a7be6944f6d4efa6eaa1a8b414ab06f6c06ed99a6c9a72ec76f # tag: v2.3.1
    environment:
      PORT: "8000"
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: "false"
      FRONTEND_SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "false"
    depends_on:
      backend:
        condition: service_started
volumes:
  data: {}
