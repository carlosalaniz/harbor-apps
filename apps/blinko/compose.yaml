services:
  db:
    image: postgres@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac # tag: 17.12
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinkouser
      POSTGRES_PASSWORD: blinkopass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -q
        - -d
        - blinko
        - -U
        - blinkouser
      interval: 10s
      timeout: 45s
      retries: 10
  app:
    image: blinkospace/blinko@sha256:ebbdcc375451570fad37319dea443c062d2a451a45d4f2ee0d98189d4b7615a5 # tag: 1.8.9
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blinkouser:blinkopass@db:5432/blinko
    volumes:
      - {type: volume, source: app, target: "/app/.blinko"}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  db: {}
  app: {}
