services:
  web:
    image: ghcr.io/advplyr/audiobookshelf@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa # tag: 2.37.2
    environment:
      TZ: "UTC"
    volumes:
      - {type: volume, source: config, target: /config}
      - {type: volume, source: metadata, target: /metadata}
      - {type: volume, source: audiobooks, target: /audiobooks}
      - {type: volume, source: podcasts, target: /podcasts}
volumes:
  audiobooks: {}
  config: {}
  metadata: {}
  podcasts: {}
