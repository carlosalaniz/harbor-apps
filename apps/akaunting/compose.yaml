services:
  app:
    image: akaunting/akaunting@sha256:988567e0cd1be314a2dad48b336883b0d5017702ea206feba39c2dac6357ad6f # tag: 3.3.1
    environment:
      AKAUNTING_SETUP: "true"
      LOCALE: en-US
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: akaunting
      DB_USERNAME: admin
      DB_PASSWORD: akaunting_password
      DB_PREFIX: asd_
      COMPANY_NAME: My Company
      COMPANY_EMAIL: my@company.com
      ADMIN_EMAIL: umbrel@umbrel.local
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707 # tag: 11.8.9
    environment:
      MYSQL_DATABASE: akaunting
      MYSQL_USER: admin
      MYSQL_PASSWORD: akaunting_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  db: {}
