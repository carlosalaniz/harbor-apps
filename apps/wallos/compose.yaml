services:
  server:
    image: bellamy/wallos@sha256:de82c41215a761d33a38a3672526b3ce47d0fe7acb84f5c2a4cb2342c710cf4c # tag: 5.11.2
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: db, target: "/var/www/html/db"}
      - {type: volume, source: logos, target: "/var/www/html/images/uploads/logos"}
    healthcheck:
      disable: true
volumes:
  db: {}
  logos: {}
