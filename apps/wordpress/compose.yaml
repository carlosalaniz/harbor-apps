services:
  app:
    image: wordpress@sha256:8b64037bb2a3bdc41bebccb165f20ad5e4c786b684ae4a2bd5981f98aa1eb107 # tag: 7.1.4
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: umbrel
      WORDPRESS_DB_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: wordpress, target: "/var/www/html"}
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707 # tag: 11.8.9
    environment:
      MYSQL_ROOT_PASSWORD: umbrelwordpressroot
      MYSQL_DATABASE: wordpress
      MYSQL_USER: umbrel
      MYSQL_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  wordpress: {}
  db: {}
