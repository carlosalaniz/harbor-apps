services:
  web:
    image: anirdev/slink@sha256:7f7cab180971caeb83ce8818a676be04a7923dff6bf6e201ae0a9ce4f64be593 # tag: v1.14.6
    environment:
      TZ: UTC
      REQUIRE_SSL: "false"
      USER_APPROVAL_REQUIRED: "false"
      USER_PASSWORD_MIN_LENGTH: "8"
      USER_PASSWORD_REQUIREMENTS: "15"
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: "true"
      IMAGE_COMPRESSION_QUALITY: "80"
      STORAGE_PROVIDER: local
    volumes:
      - {type: volume, source: var, target: "/app/var/data"}
      - {type: volume, source: images, target: "/app/slink/images"}
    healthcheck:
      disable: true
volumes:
  var: {}
  images: {}
