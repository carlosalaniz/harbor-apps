services:
  app:
    image: ghcr.io/wavelog/wavelog@sha256:e371b599572bbd50b019acf8bf54009df7042bbd8f238d905a540d6e956b2c25 # tag: 3.2.5
    environment:
      CI_ENV: docker
    volumes:
      - {type: volume, source: config, target: "/var/www/html/application/config/docker"}
      - {type: volume, source: uploads, target: "/var/www/html/uploads"}
      - {type: volume, source: userdata, target: "/var/www/html/userdata"}
    depends_on:
      wavelog-db:
        condition: service_started
  wavelog-db:
    image: mariadb@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd # tag: 11.8
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: yes
      MARIADB_DATABASE: wavelog
      MARIADB_USER: wavelog
      MARIADB_PASSWORD: wavelog
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  config: {}
  uploads: {}
  userdata: {}
  db: {}
