services:
  web:
    image: anirdev/slink@sha256:529ac1e0cb9d4509f95b6a5b982b28e43980a8696f05091f81b67de8450038c7 # tag: v1.14.4
    environment:
      TZ: UTC
      REQUIRE_SSL: "false"
      USER_APPROVAL_REQUIRED: "false"
      USER_PASSWORD_MIN_LENGTH: "8"
      USER_PASSWORD_REQUIREMENTS: "15"
      IMAGE_MAX_SIZE: 15M
      IMAGE_STRIP_EXIF_METADATA: "true"
      IMAGE_COMPRESSION_QUALITY: "80"
      STORAGE_PROVIDER: local
    volumes:
      - {type: volume, source: var, target: "/app/var/data"}
      - {type: volume, source: images, target: "/app/slink/images"}
    healthcheck:
      disable: true
volumes:
  var: {}
  images: {}
