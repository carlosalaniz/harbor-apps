services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:3538e3d464038695cd86cfb1d7c63f60b343b462f1a77bfa00a93507c9694b86 # tag: 2.90.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
