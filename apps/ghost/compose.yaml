services:
  web:
    image: ghost@sha256:c0d83a8d45222b3f37a897572000050ab8e6e507d3eee5a35b3ef8345c7293d6 # tag: 6.72.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: umbrel
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - {type: volume, source: content, target: "/var/lib/ghost/content"}
  db:
    image: mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69 # tag: 8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: umbrel
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  content: {}
  db: {}
