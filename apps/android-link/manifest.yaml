apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: android-link
  name: Android Link
  description: "Your Android phones in the browser: find one on this machine's network and pair it with its code, then see and use its screen with a real keyboard and mouse, open a shell, and run automations like linking WhatsApp to a computer. Nothing to install on the phone."
release:
  revision: "2"
  version: 0.2.0
  # 0.41.1 is the first gate that serves an app whose health path answers before any account (decision 194)
  minHarbor: "0.41.1"
deployment:
  compose: compose.yaml
  multiInstance: false
  services:
    link: application
endpoints:
  web:
    service: link
    containerPort: 8001
    scheme: http
    exposure: direct
    # the screen decodes video with WebCodecs, which browsers only offer to secure pages
    browserContext: secure
    # phones' screens, a shell on each, scripts that drive them: Harbor's login is always in front (decision 194)
    login: required
health:
  endpoint: web
  path: /api/health
  expectedStatus: [200]
  timeoutSeconds: 10
  deadlineSeconds: 180
ui:
  primaryEndpoint: web
setup:
  endpoint: web
  instructions: "Open Android Link and type its password (shown after install; the app's drawer shows it again under Login). On the phone, turn on Developer options and Wireless debugging and tap \"Pair device with pairing code\": the phone shows up in Android Link under Add a phone; type its code and press Pair."
settings:
  - id: discovery-subnets
    label: "Home network range"
    help: "Where Android Link looks for phones, e.g. 192.168.1.0/24 (several: separated by spaces). Empty: the network of whoever opens the app. Needed only when phones do not show up under Add a phone."
    type: string
    default: ""
    maxLength: 200
    bindings:
      - service: link
        environment: LINK_DISCOVERY_SUBNETS
storage:
  - id: data
    composeVolume: data
    purpose: "Paired phones and the key they trust (losing it means pairing again), shell history, scripts and their runs"
    retention: retain
presentation:
  tagline: "Your phones in the browser"
  sizeHint: "About 900 MB (a 200 MB download); a little memory per open screen"
  category: developer
  icon: icon.svg
  developer: "Carlos Alaniz (phone screen: scrcpy by Genymobile)"
  website: https://github.com/carlosalaniz/android-link
  source: https://github.com/carlosalaniz/android-link
  releaseNotes: "0.2.0: a new app on one address. Phones on the network show up by themselves (pair with the code alone) and reconnect after a restart. The screen runs on scrcpy 5 with a hardware keyboard and mouse (your own, an on-screen keyboard, a touchpad), which apps that ignore injected input accept. A shell with history on each phone. Automations: scripts you write in TypeScript, run safely on the server; the first links WhatsApp to a computer with its code. An API for programs and AI agents (Swagger at /api/docs, /api/discovery). The old ws-scrcpy screens page is gone from this app."
