services:
  influxdb:
    image: influxdb@sha256:ffa96366d916545608b8ae8dcc09d1efb5d792e4139096dfdcb1daf8789b211a # tag: 1.13.2
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - {type: volume, source: influxdb, target: "/var/lib/influxdb"}
  chronograf:
    image: chronograf@sha256:973b10204ba70249c4f778611d398d47f861984be037ee52c8320a953c7a4956 # tag: 1.11.7
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_USERNAME: admin
    volumes:
      - {type: volume, source: chronograf, target: "/var/lib/chronograf"}
    depends_on:
      influxdb:
        condition: service_started
volumes:
  influxdb: {}
  chronograf: {}
