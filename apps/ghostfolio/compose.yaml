services:
  db:
    # PostgreSQL 15, the version upstream's own compose file runs
    image: postgres@sha256:5cb339462bde5e6b617acedf6c2a3008f3aadc44a3c0507dd22226ee1279aee8 # tag: 15.20-alpine
    environment:
      POSTGRES_DB: "ghostfolio"
      POSTGRES_USER: "ghostfolio"
    healthcheck:
      # Over TCP: the temporary server of the first initialisation only listens on its socket
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ghostfolio, -d, ghostfolio]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db-data, target: /var/lib/postgresql/data}
  redis:
    # Cache and job queues only: nothing in it is real data, so it never persists
    image: redis@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3 # tag: 8.10.3-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: ghostfolio/ghostfolio@sha256:6aeba7b9df7a18bc4f39810444b1f18af012a7fe323cec20640b7c28661fc47c # tag: 3.99.0
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # Every start runs the Prisma CLI through npx (migrate, seed): no usage telemetry to
      # checkpoint.prisma.io, and no npm version check against the registry
      CHECKPOINT_DISABLE: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    # No container healthcheck: the first start migrates the database for a while, and Harbor's own
    # check of /api/v1/health (manifest health:) waits for it
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  db-data: {}
