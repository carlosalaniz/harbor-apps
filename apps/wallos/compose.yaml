services:
  server:
    image: bellamy/wallos@sha256:8873c2328e745c7ca8ff0e0f5508215219ec5c02a3469c0d8049602be2a2bca3 # tag: 5.10.2
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: db, target: "/var/www/html/db"}
      - {type: volume, source: logos, target: "/var/www/html/images/uploads/logos"}
    healthcheck:
      disable: true
volumes:
  db: {}
  logos: {}
