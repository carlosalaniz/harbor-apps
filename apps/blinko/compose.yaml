services:
  db:
    image: postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f # tag: 17.11
    environment:
      POSTGRES_DB: blinko
      POSTGRES_USER: blinkouser
      POSTGRES_PASSWORD: blinkopass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -q
        - -d
        - blinko
        - -U
        - blinkouser
      interval: 10s
      timeout: 45s
      retries: 10
  app:
    image: blinkospace/blinko@sha256:ebbdcc375451570fad37319dea443c062d2a451a45d4f2ee0d98189d4b7615a5 # tag: 1.8.9
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://blinkouser:blinkopass@db:5432/blinko
    volumes:
      - {type: volume, source: app, target: "/app/.blinko"}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
volumes:
  db: {}
  app: {}
