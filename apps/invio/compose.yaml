services:
  backend:
    image: ghcr.io/kittendevv/invio-backend@sha256:723f780c2704739d5ab8ee5fd67444619854b8de0cb4b4513dbbb19a840af793 # tag: v2.5.0
    environment:
      ADMIN_USER: admin
      SESSION_TTL_SECONDS: "43200"
      SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "true"
      DATABASE_PATH: /app/data/invio.db
    volumes:
      - {type: volume, source: data, target: "/app/data"}
  frontend:
    image: ghcr.io/kittendevv/invio-frontend@sha256:400e8ddc16f84e0ede35e2097b58c7171492aeda56edb769abaebf0406fabef7 # tag: v2.5.0
    environment:
      PORT: "8000"
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: "false"
      FRONTEND_SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "false"
    depends_on:
      backend:
        condition: service_started
volumes:
  data: {}
