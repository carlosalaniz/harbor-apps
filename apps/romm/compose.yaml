services:
  romm:
    image: rommapp/romm@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf # tag: 5.4.1
    environment:
      DB_HOST: "db"
      DB_NAME: "romm"
      DB_USER: "romm"
      HASHEOUS_API_ENABLED: "true"
      WEB_SERVER_CONCURRENCY: "2"
      SCAN_WORKERS: "2"
      TZ: "UTC"
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - {type: volume, source: data, target: /romm}
      - {type: volume, source: library, target: /romm/library}
      - {type: volume, source: cache, target: /redis-data}
  db:
    image: mariadb@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd # tag: 11.8.9
    environment:
      MARIADB_DATABASE: "romm"
      MARIADB_USER: "romm"
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - {type: volume, source: database, target: /var/lib/mysql}
volumes:
  data: {}
  library: {}
  cache: {}
  database: {}
