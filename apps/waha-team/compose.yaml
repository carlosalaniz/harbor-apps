# WAHA Team (https://github.com/carlosalaniz/waha-team): one WhatsApp number shared by a team, every message signed with
# its author's name. One Node process on port 8080: the JSON API, the web app, and the browsers' live socket. Its
# database (SQLite) and copies of media files live on the data volume. It reaches WAHA (and Android Link) at the
# addresses Harbor's links give it, or the ones an admin types in the app, and reads WAHA's events over WAHA's own
# WebSocket: nothing has to reach WAHA Team except browsers.
services:
  app:
    image: ghcr.io/carlosalaniz/waha-team@sha256:92cc2524d813702076ebc001527b91e05982631761a49c9497eff96d993af8b1 # tag: 0.3.3
    environment:
      DATA_DIR: /data
      PORT: "8080"
      WAHA_SESSION: default
    volumes:
      - {type: volume, source: data, target: /data}
volumes:
  data: {}
