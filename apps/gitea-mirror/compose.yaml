services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:00e8c4d67fc1c403dfa2eeb03e5d9454d6ab69dc710ec3caeacaaa848a12ddac # tag: v3.51.5
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
