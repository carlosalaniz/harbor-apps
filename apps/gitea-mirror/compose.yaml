services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:755b6e3b3d63a00c247096e67ac8438f65cba2233ddee5e88e8c9763dc230a06 # tag: v3.51.0
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
