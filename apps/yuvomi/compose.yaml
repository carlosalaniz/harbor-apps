services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:c4b98dcfa07893ac3da3d5ca22d2b18492fdc81075fbbfead9050ce3821440af # tag: 2.95.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
