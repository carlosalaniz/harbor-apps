services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:7bdba393749c5c9c11185e7292e04342d6d443216497f4cdccdbbfcca6802622 # tag: 2.94.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
