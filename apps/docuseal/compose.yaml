services:
  server:
    image: docuseal/docuseal@sha256:28d0ca583860e2c73e5b068756023a93a325799a22da1f788355d566865dd051 # tag: 3.3.3
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
      - {type: volume, source: app, target: "/data/docuseal"}
    depends_on:
      db:
        condition: service_started
  db:
    image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe # tag: 17.11
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
