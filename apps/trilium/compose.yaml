services:
  server:
    image: triliumnext/trilium@sha256:d87d810fdcb549db65710a40933acaa16bc75c9426a9164c547f7ba95592941b # tag: v0.106.1
    environment:
      TZ: "UTC"
    volumes:
      - {type: volume, source: data, target: /home/node/trilium-data}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/api/health-check').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
volumes:
  data: {}
