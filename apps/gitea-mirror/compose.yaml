services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:0f6c3ee2d1ff443e89a5d49bf3dd25aa3282ffc8480d3c8af0a3f35bc6396b21 # tag: v3.46.0
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
