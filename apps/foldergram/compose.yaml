services:
  web:
    image: ghcr.io/foldergram/foldergram@sha256:5b0bfd2779c2d33999441f8e78c88de50b4d803305be1d2bb8a6cae7479da9e4 # tag: 1.3.0
    environment:
      IMAGE_DETAIL_SOURCE: preview
      DERIVATIVE_MODE: eager
    volumes:
      - {type: volume, source: gallery, target: "/app/data/gallery"}
      - {type: volume, source: db, target: "/app/data/db"}
      - {type: volume, source: thumbnails, target: "/app/data/thumbnails"}
      - {type: volume, source: previews, target: "/app/data/previews"}
volumes:
  gallery: {}
  db: {}
  thumbnails: {}
  previews: {}
