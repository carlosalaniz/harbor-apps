services:
  db:
    image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe # tag: 17.11
    environment:
      POSTGRES_USER: "nextcloud"
      POSTGRES_DB: "nextcloud"
    healthcheck:
      test: [CMD, pg_isready, -U, nextcloud, -d, nextcloud]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: /var/lib/postgresql/data}
  redis:
    image: redis@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0 # tag: 8.10.2-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    image: nextcloud@sha256:1f9212adecae32010cdbf137d7e0db78d08c696dc3e77f1eddcbf902d10209b4 # tag: 34.0.5-apache
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "nextcloud"
      REDIS_HOST: "redis"
      PHP_MEMORY_LIMIT: "1G"
      PHP_UPLOAD_LIMIT: "16G"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - {type: volume, source: html, target: /var/www/html}
      - {type: volume, source: data, target: /var/www/html/data}
volumes:
  data: {}
  db: {}
  html: {}
