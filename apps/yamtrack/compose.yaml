services:
  web:
    image: ghcr.io/fuzzygrim/yamtrack@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75 # tag: 0.26.3
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - {type: volume, source: db, target: "/yamtrack/db"}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      disable: true
  redis:
    image: redis@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53 # tag: 8.10.3
    volumes:
      - {type: volume, source: redis, target: "/data"}
volumes:
  db: {}
  redis: {}
