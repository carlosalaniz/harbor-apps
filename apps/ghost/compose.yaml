services:
  web:
    image: ghost@sha256:2e3ca97643ea2a8cde6d0c97fae15ff39bfb60714f5abaab3f65263a2ed7c2a7 # tag: 6.77.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: umbrel
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - {type: volume, source: content, target: "/var/lib/ghost/content"}
  db:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902 # tag: 8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: umbrel
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  content: {}
  db: {}
