services:
  app:
    image: ghcr.io/carlosalaniz/crossbar-app@sha256:8a6b86227e5053c65d91a36c684e6690af67f085fdb2cfb1fa643be8ddd925b0 # tag: 0.1.3
    environment:
      CROSSBAR_BROWSER_URL: http://browser:9300
      CROSSBAR_DATA: /data
      # CROSSBAR_PROFILE (default | nino) is the manifest's `profile` setting: Harbor sets it, so it is not set here.
    volumes:
      - {type: volume, source: app-data, target: /data}
    depends_on:
      browser:
        condition: service_started
  browser:
    image: ghcr.io/carlosalaniz/crossbar-browser@sha256:5dfa361581c754012901f2edc3b26fdf74a04537f0882254ff6d90aef9e5425f # tag: 0.1.3
    environment:
      CROSSBAR_PROXY: http://proxy:3128
      CROSSBAR_PROFILES: /profiles
    volumes:
      - {type: volume, source: profiles, target: /profiles}
    depends_on:
      proxy:
        condition: service_started
  proxy:
    image: ghcr.io/carlosalaniz/crossbar-proxy@sha256:7c98e2d40d8fcf4b594735c20d34d0c2e544abb0b33686898247d6d8c942a87d # tag: 0.1.3
volumes:
  app-data: {}
  profiles: {}
