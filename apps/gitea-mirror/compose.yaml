services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:2ea8a56827f0334b4717ed95a4d9c7111c3f73031741627e008fbc8f775517bf # tag: v3.42.0
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
