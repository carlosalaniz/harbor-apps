services:
  server:
    image: docuseal/docuseal@sha256:2786607f1f6eb54f982a926bd78c81ee23b6545e59d1ff548bd672094760621c # tag: 3.3.4
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
      - {type: volume, source: app, target: "/data/docuseal"}
    depends_on:
      db:
        condition: service_started
  db:
    image: postgres@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f # tag: 17.11
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
