services:
  api:
    image: localai/localai@sha256:c8556c4f7b6dd9b76e915d515ab5cfe5a765d8ea8fd3f0cf563f9c690b48a7f4 # tag: v4.12.1
    environment:
      MODELS_PATH: /models
      LOCALAI_BACKENDS_PATH: /backends
      LOCALAI_EXTERNAL_BACKENDS: cpu-llama-cpp
      LOCALAI_FORCE_META_BACKEND_CAPABILITY_RUN_FILE: /nonexistent
      NVIDIA_DISABLE_REQUIRE: "true"
    volumes:
      - {type: volume, source: models, target: "/models"}
      - {type: volume, source: backends, target: "/backends"}
      - {type: volume, source: data, target: "/data"}
      - {type: volume, source: configuration, target: "/configuration"}
      - {type: volume, source: images, target: "/tmp/generated/images"}
    healthcheck:
      disable: true
volumes:
  models: {}
  backends: {}
  data: {}
  configuration: {}
  images: {}
