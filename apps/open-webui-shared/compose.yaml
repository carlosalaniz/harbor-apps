services:
  web:
    image: ghcr.io/open-webui/open-webui@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def # tag: v0.12.3
    # OLLAMA_BASE_URL comes from the ollama link (manifest). ENABLE_OLLAMA_API stays at Open WebUI's default (on):
    # with the link that is right, and without it Open WebUI only reports Ollama as unreachable.
    environment:
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "pending"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - {type: volume, source: data, target: /app/backend/data}
volumes:
  data: {}
