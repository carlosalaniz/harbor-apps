services:
  app:
    image: akaunting/akaunting@sha256:c31902a19b5b135d654f751111157b94642bf97aab26fbe1381625646d89e355 # tag: 3.3.2
    environment:
      AKAUNTING_SETUP: "true"
      LOCALE: en-US
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: akaunting
      DB_USERNAME: admin
      DB_PASSWORD: akaunting_password
      DB_PREFIX: asd_
      COMPANY_NAME: My Company
      COMPANY_EMAIL: my@company.com
      ADMIN_EMAIL: umbrel@umbrel.local
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc # tag: 11.8.9
    environment:
      MYSQL_DATABASE: akaunting
      MYSQL_USER: admin
      MYSQL_PASSWORD: akaunting_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  db: {}
