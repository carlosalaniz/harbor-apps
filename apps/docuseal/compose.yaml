services:
  server:
    image: docuseal/docuseal@sha256:b664cc84014f607f090140973f2e082cc551954d42f6f17e07fdd54dee6fdc08 # tag: 3.4.0
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
      - {type: volume, source: app, target: "/data/docuseal"}
    depends_on:
      db:
        condition: service_started
  db:
    image: postgres@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf # tag: 17.12
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
