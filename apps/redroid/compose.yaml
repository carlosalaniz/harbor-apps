# Android in a container (redroid) with a browser screen (ws-scrcpy) behind Harbor's app login.
#
# android  redroid only runs as a privileged container on a kernel with Android's binder driver: the manifest asks for
#          both (permissions privileged + binder, Harbor decision 193; only official-catalog apps get them). Harbor
#          loads binder_linux before the first start and at every boot. adb (5555) stays inside the app network: only
#          the screen service reaches it. Boot arguments: 720x1280 at 320 dpi, software rendering (guest; no GPU
#          needed), memfd (kernels since 5.18 have no ashmem). The health check only reports; the screen does not wait
#          for it (a first boot can outlast Harbor's start timeout) and keeps reconnecting instead.
# screen   ws-scrcpy, built by this repository from a pinned upstream commit (images/ws-scrcpy). It keeps adb connected
#          to android:5555, and HARBOR_INPUT makes the browser's taps and keys hardware input (a uinput touchscreen and
#          keyboard inside Android, daemon on android:7008): some apps, WhatsApp's registration among them, ignore
#          the virtual input scrcpy injects otherwise. It has no login of its own and offers an adb shell, so its endpoint declares
#          `login: required` (Harbor decision 194): Harbor's login page is always in front of it, with a password the
#          operator can see and change in the app's drawer.
services:
  android:
    image: redroid/redroid@sha256:81889852444606824d33eb0232fa5813bce3f0993afe871785120af0d7c991ad # tag: 15.0.0-250627
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=1
    volumes:
      - {type: volume, source: data, target: /data}
    healthcheck:
      test: [CMD, sh, -c, 'test "$(getprop sys.boot_completed)" = 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5m
  screen:
    image: ghcr.io/carlosalaniz/ws-scrcpy@sha256:afc7135ad72739e539c3b0290b32b115d49daabbe14c762bc8794c5b7df1d94c # tag: 0.9.0-dev.20260930.cd6cea6.h1
    environment:
      ADB_CONNECT: android:5555
      HARBOR_INPUT: android:7008
    depends_on:
      android: {condition: service_started}
volumes:
  data: {}
