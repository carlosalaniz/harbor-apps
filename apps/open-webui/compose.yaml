services:
  ollama:
    image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551 # tag: 0.34.4
    # OLLAMA_IGPU_ENABLE admits integrated Intel/AMD graphics (Vulkan, on by default in this release), which Ollama
    # drops otherwise; it does not change a discrete NVIDIA card.
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - {type: volume, source: models, target: /root/.ollama}
  web:
    image: ghcr.io/open-webui/open-webui@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7 # tag: v0.12.4
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: "pending"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      # Image generation defaults, read once at Open WebUI's first start (it keeps them in its database after that):
      # the node map of Open WebUI's own ComfyUI workflow (6 prompt, 4 model, 5 size, 3 steps and seed), which it
      # ships empty, and an SDXL-sized picture. Image generation stays off until it is turned on under Images.
      COMFYUI_WORKFLOW_NODES: '[{"type":"prompt","key":"text","node_ids":["6"]},{"type":"model","key":"ckpt_name","node_ids":["4"]},{"type":"width","key":"width","node_ids":["5"]},{"type":"height","key":"height","node_ids":["5"]},{"type":"steps","key":"steps","node_ids":["3"]},{"type":"seed","key":"seed","node_ids":["3"]}]'
      IMAGE_SIZE: "1024x1024"
      IMAGE_STEPS: "25"
    depends_on:
      ollama: {condition: service_started}
    volumes:
      - {type: volume, source: data, target: /app/backend/data}
volumes:
  data: {}
  models: {}
