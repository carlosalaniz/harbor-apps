services:
  db:
    # PostgreSQL 16, the major upstream's own compose file runs
    image: postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # tag: 16.15
    environment:
      POSTGRES_DB: "sure_production"
      POSTGRES_USER: "sure"
    healthcheck:
      # Over TCP: the temporary server of the first initialisation only listens on its socket
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, sure, -d, sure_production]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db-data, target: /var/lib/postgresql/data}
  redis:
    # Sidekiq's job queue: kept on disk (append-only file) so queued imports and syncs survive a restart
    image: redis@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3 # tag: 8.10.3-alpine
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - {type: volume, source: redis-data, target: /data}
  web:
    # The image's entrypoint runs `rails db:prepare` (create or migrate) before the server listens on 3000
    image: ghcr.io/we-promise/sure@sha256:002cde609f3af4b69ba2564c2482f3996e1fe29092dd169962b9b6ed943fcb10 # tag: 0.7.6-hotfix.1
    environment:
      SELF_HOSTED: "true"
      DB_HOST: "db"
      DB_PORT: "5432"
      POSTGRES_DB: "sure_production"
      POSTGRES_USER: "sure"
      REDIS_URL: "redis://redis:6379/1"
      # Harbor serves plain http on the LAN and terminates HTTPS itself (secure LAN, Tailscale, domain), passing
      # X-Forwarded-Proto: Rails must neither redirect to https nor assume it
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      # Off: a self-hosted Sure otherwise reports daily UI usage to the project's PostHog
      POSTHOG_FEEDBACK_ENABLED: "false"
    # No container healthcheck: the first start migrates the database, and Harbor's own check of /up
    # (manifest health:) waits for it
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - {type: volume, source: app-storage, target: /rails/storage}
  worker:
    # Same image, Sidekiq: account syncs, imports, market data, scheduled jobs
    image: ghcr.io/we-promise/sure@sha256:002cde609f3af4b69ba2564c2482f3996e1fe29092dd169962b9b6ed943fcb10 # tag: 0.7.6-hotfix.1
    command: [bundle, exec, sidekiq]
    # The same environment as web
    environment:
      SELF_HOSTED: "true"
      DB_HOST: "db"
      DB_PORT: "5432"
      POSTGRES_DB: "sure_production"
      POSTGRES_USER: "sure"
      REDIS_URL: "redis://redis:6379/1"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      POSTHOG_FEEDBACK_ENABLED: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - {type: volume, source: app-storage, target: /rails/storage}
volumes:
  db-data: {}
  redis-data: {}
  app-storage: {}
