services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:c4be6513acba202f03102ea607db527835ca8832395b17e7c077badcba603019 # tag: 2.91.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
