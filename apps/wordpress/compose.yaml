services:
  app:
    image: wordpress@sha256:2e5145737f46b8fd53f333a05eb3a4f21321c90e20475b7827082dd5f75b62b0 # tag: 7.1.5
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: umbrel
      WORDPRESS_DB_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: wordpress, target: "/var/www/html"}
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:e1d5495f445654134f226f55a41ce0da227116f6f27f283101f405c794d841fc # tag: 11.8.9
    environment:
      MYSQL_ROOT_PASSWORD: umbrelwordpressroot
      MYSQL_DATABASE: wordpress
      MYSQL_USER: umbrel
      MYSQL_PASSWORD: umbrelwordpress
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  wordpress: {}
  db: {}
