services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:be5600216ff8a152ea7ddd9152c68cc94b56886e85bf44fe67853ee1bcac2ada # tag: v3.54.0
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
