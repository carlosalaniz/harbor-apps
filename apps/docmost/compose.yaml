services:
  web:
    image: docmost/docmost@sha256:40c454d74ffdd9ecb15833e4d96f3a630d59aad862a1869381ae6ee086454419 # tag: 0.97.0
    environment:
      DATABASE_URL: postgresql://docmostuser:docmostpass@db:5432/docmost?sslmode=disable
      REDIS_URL: redis://redis:6379
      DISABLE_TELEMETRY: "true"
    volumes:
      - {type: volume, source: docmost-data, target: "/app/data/storage"}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
  db:
    image: postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f # tag: 17.11
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmostuser
      POSTGRES_PASSWORD: docmostpass
    volumes:
      - {type: volume, source: db-data, target: "/var/lib/postgresql/data"}
  redis:
    image: redis@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53 # tag: 8.10.3
    volumes:
      - {type: volume, source: redis-data, target: "/data"}
volumes:
  docmost-data: {}
  db-data: {}
  redis-data: {}
