services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:59992c2dd5db14be779aae35487a35ea8ef8dad4943d4c9fa50d3e6522c5e3a4 # tag: 2.91.1
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
