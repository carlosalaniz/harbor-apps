services:
  app:
    image: ghcr.io/carlosalaniz/crossbar-app@sha256:9046899388f2161e50368f9818d7df353a973a462be1e8922eb5ff39ff7a2ea9 # tag: 0.1.4
    environment:
      CROSSBAR_BROWSER_URL: http://browser:9300
      CROSSBAR_DATA: /data
      # CROSSBAR_PROFILE (default | nino) is the manifest's `profile` setting: Harbor sets it, so it is not set here.
    volumes:
      - {type: volume, source: app-data, target: /data}
    depends_on:
      browser:
        condition: service_started
  browser:
    image: ghcr.io/carlosalaniz/crossbar-browser@sha256:903227667db654341d7854571bbdf40b8f0c562c9d97ec38f7d11a73d3935060 # tag: 0.1.4
    environment:
      CROSSBAR_PROXY: http://proxy:3128
      CROSSBAR_PROFILES: /profiles
    volumes:
      - {type: volume, source: profiles, target: /profiles}
    depends_on:
      proxy:
        condition: service_started
  proxy:
    image: ghcr.io/carlosalaniz/crossbar-proxy@sha256:93e011148cef28bc714099b337d78a09633ca1e27d0cc5f2a1f683513a226ea9 # tag: 0.1.4
volumes:
  app-data: {}
  profiles: {}
