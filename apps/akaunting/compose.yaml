services:
  app:
    image: akaunting/akaunting@sha256:af69b0343db9b9f7979e15c4be3d50ee502e38edb71190953db7b280d10d0edb # tag: 3.3.0
    environment:
      AKAUNTING_SETUP: "true"
      LOCALE: en-US
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: akaunting
      DB_USERNAME: admin
      DB_PASSWORD: akaunting_password
      DB_PREFIX: asd_
      COMPANY_NAME: My Company
      COMPANY_EMAIL: my@company.com
      ADMIN_EMAIL: umbrel@umbrel.local
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd # tag: 11.8.9
    environment:
      MYSQL_DATABASE: akaunting
      MYSQL_USER: admin
      MYSQL_PASSWORD: akaunting_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  db: {}
