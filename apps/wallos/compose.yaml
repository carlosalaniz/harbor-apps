services:
  server:
    image: bellamy/wallos@sha256:78b73a32ae24bcca67d6f4b96ca76fe29ee8da5e8df1769df1e612a4e776c904 # tag: 5.10.4
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: db, target: "/var/www/html/db"}
      - {type: volume, source: logos, target: "/var/www/html/images/uploads/logos"}
    healthcheck:
      disable: true
volumes:
  db: {}
  logos: {}
