services:
  web:
    image: docmost/docmost@sha256:c3bdc84767de0fc9431763523636ddfd783c35c25ef7d4a3c95c064628e78d7a # tag: 0.98.0
    environment:
      DATABASE_URL: postgresql://docmostuser:docmostpass@db:5432/docmost?sslmode=disable
      REDIS_URL: redis://redis:6379
      DISABLE_TELEMETRY: "true"
    volumes:
      - {type: volume, source: docmost-data, target: "/app/data/storage"}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
  db:
    image: postgres@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9 # tag: 17.12
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmostuser
      POSTGRES_PASSWORD: docmostpass
    volumes:
      - {type: volume, source: db-data, target: "/var/lib/postgresql/data"}
  redis:
    image: redis@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed # tag: 8.12.0
    volumes:
      - {type: volume, source: redis-data, target: "/data"}
volumes:
  docmost-data: {}
  db-data: {}
  redis-data: {}
