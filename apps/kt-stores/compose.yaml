# Knowledge stores that agents discover and search through MCP (KT Stores, https://github.com/carlosalaniz/kt-stores).
#
# kt      One image, two processes: the API and web app on 8001 (no login of its own: the endpoint declares
#         `login: required`) and MCP on 8002 (its own bearer tokens), plus the background worker. Original files, the
#         database and settings live on the data volume.
# qdrant  The vector index, reachable only on the app's own network. It can be rebuilt from the files.
services:
  kt:
    image: ghcr.io/carlosalaniz/kt-stores@sha256:24913b4c751d3dd2dd3cf3d4359ab1c67d094d737924f9cf2080cba7b2c52979 # tag: 0.1.1
    environment:
      KT_DATA: /data
      KT_QDRANT_URL: http://qdrant:6333
    volumes:
      - {type: volume, source: data, target: /data}
    # the app copes with Qdrant still starting: indexing waits for it
    depends_on:
      qdrant: {condition: service_started}
  qdrant:
    image: qdrant/qdrant@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2 # tag: v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - {type: volume, source: qdrant, target: /qdrant/storage}
volumes:
  data: {}
  qdrant: {}
