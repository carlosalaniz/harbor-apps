services:
  app:
    image: etherpad/etherpad@sha256:ebe37b915aa25072b0bd13d94bd83ae6a4eb58cb81e876b217b230addb6eb8b4 # tag: 3.3.10
    environment:
      NODE_ENV: production
      CI: "true"
      DB_CHARSET: utf8mb4
      DB_HOST: postgres
      DB_NAME: etherpad
      DB_PASS: admin
      DB_PORT: "5432"
      DB_TYPE: postgres
      DB_USER: admin
      DEFAULT_PAD_TEXT: ""
      DISABLE_IP_LOGGING: "false"
      LOGLEVEL: INFO
      SOFFICE: ""
      ALLOW_UNKNOWN_FILE_ENDS: "true"
      TRUST_PROXY: "true"
      SKIN_NAME: colibris
      SKIN_VARIANTS: super-light-toolbar super-light-editor light-background
      SHOW_SETTINGS_IN_ADMIN_PAGE: "true"
      SUPPRESS_ERRORS_IN_PAD_TEXT: "false"
    volumes:
      - {type: volume, source: plugins, target: "/opt/etherpad-lite/src/plugin_packages"}
      - {type: volume, source: etherpad-var, target: "/opt/etherpad-lite/var"}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  postgres:
    image: postgres@sha256:a8e042598834300dfaa17a54f695b87b7f25d3490433bbbe2ef3bffbb9747f24 # tag: 15-alpine
    environment:
      POSTGRES_DB: etherpad
      POSTGRES_PASSWORD: admin
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, admin, -d, etherpad]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: postgres-data, target: "/var/lib/postgresql/data/pgdata"}
volumes:
  plugins: {}
  etherpad-var: {}
  postgres-data: {}
