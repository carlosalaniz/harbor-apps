services:
  server:
    image: docuseal/docuseal@sha256:df78e750ec0df42c121225875714487998048c9c80f412c1d5a0b9290887ba5c # tag: 3.3.6
    environment:
      DATABASE_URL: postgresql://docusealuser:docusealpass@db:5432/docuseal?sslmode=disable
    volumes:
      - {type: volume, source: app, target: "/data/docuseal"}
    depends_on:
      db:
        condition: service_started
  db:
    image: postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f # tag: 17.11
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docusealuser
      POSTGRES_PASSWORD: docusealpass
    volumes:
      - {type: volume, source: db, target: "/var/lib/postgresql/data"}
volumes:
  app: {}
  db: {}
