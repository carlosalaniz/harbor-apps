services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:d0c68119051d3d64ec89a0b83ec28afb13df4c5a5dd20124799d0de32f3d9887 # tag: v3.51.6
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
