services:
  backend:
    image: ghcr.io/kittendevv/invio-backend@sha256:ea93d65abe16dd744bf8319048f0afb3d010cc4152ce0e568ee8b2752eddaa47 # tag: v2.3.0
    environment:
      ADMIN_USER: admin
      SESSION_TTL_SECONDS: "43200"
      SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "true"
      DATABASE_PATH: /app/data/invio.db
    volumes:
      - {type: volume, source: data, target: "/app/data"}
  frontend:
    image: ghcr.io/kittendevv/invio-frontend@sha256:13d16e68e015412c28e1d925a42ab71f371ad31d8a2dc2eeaddf9c5b51610660 # tag: v2.3.0
    environment:
      PORT: "8000"
      BACKEND_URL: http://backend:3000
      COOKIE_SECURE: "false"
      FRONTEND_SECURE_HEADERS_DISABLED: "false"
      ENABLE_HSTS: "false"
    depends_on:
      backend:
        condition: service_started
volumes:
  data: {}
