services:
  web:
    image: ghcr.io/fuzzygrim/yamtrack@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75 # tag: 0.26.3
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - {type: volume, source: db, target: "/yamtrack/db"}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      disable: true
  redis:
    image: redis@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed # tag: 8.12.0
    volumes:
      - {type: volume, source: redis, target: "/data"}
volumes:
  db: {}
  redis: {}
