services:
  web:
    image: ghost@sha256:3e62a20e7f172af9c313bcd74c67098359c4fa7f7121a20ebd740c9f6cd0c0b9 # tag: 6.73.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: umbrel
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - {type: volume, source: content, target: "/var/lib/ghost/content"}
  db:
    image: mysql@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7 # tag: 8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: umbrel
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  content: {}
  db: {}
