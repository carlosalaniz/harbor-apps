services:
  # Plane's own Caddy proxy (plane-proxy) with Plane's v1.4.2 routes (apps/proxy/Caddyfile.ce: /api, /auth, /static to
  # api, /spaces to space, /god-mode to admin, /live to live, /uploads to plane-minio, the rest to web), plain HTTP on
  # :80 behind Harbor's proxies. The config comes on stdin (no bind mounts) so it can add what lets Plane work at
  # every address Harbor gives it, not only the main one (WEB_URL):
  #   - redirects to WEB_URL become path-only, so signing in keeps you on the address you came from;
  #   - the api and MinIO see the address the browser used (X-Forwarded-Host, which Harbor's secure LAN relay sets
  #     while it sends Host 127.0.0.1:<port>), so CSRF checks and presigned upload/download URLs match it;
  #   - on plain http, Plane's cookies lose Secure (Plane marks them Secure when the main address is https).
  # When plane-proxy moves to a new Plane release, compare its Caddyfile.ce with the routes below.
  proxy:
    image: makeplane/plane-proxy@sha256:8c25e877ad58035eb8d8d2697b007495fb725abd0ce804f5ed5a36e7c58a37b0 # tag: v1.4.3
    command:
      - sh
      - -c
      - |
        exec caddy run --config - --adapter caddyfile <<'EOF'
        {
          servers {
            max_header_size 25MB
            client_ip_headers X-Forwarded-For X-Real-IP
            trusted_proxies static 0.0.0.0/0
          }
        }

        :80 {
          request_body {
            max_size 5242880
          }

          map {http.request.header.X-Forwarded-Host} {plane_host} {
            "" {http.request.hostport}
            default {http.request.header.X-Forwarded-Host}
          }
          header >Location "^{env.WEB_URL}/?" "/"
          @plain not header X-Forwarded-Proto https
          header @plain >Set-Cookie "(?i);\s*secure(;|$)" "$1"

          redir /spaces /spaces/ permanent
          reverse_proxy /spaces/* space:3000

          redir /god-mode /god-mode/ permanent
          reverse_proxy /god-mode/* admin:3000

          reverse_proxy /live/* live:3000

          reverse_proxy /api/* api:8000 {
            header_up Host {plane_host}
          }
          reverse_proxy /auth/* api:8000 {
            header_up Host {plane_host}
          }
          reverse_proxy /static/* api:8000

          reverse_proxy /uploads/* plane-minio:9000 {
            header_up Host {plane_host}
          }
          reverse_proxy /uploads plane-minio:9000 {
            header_up Host {plane_host}
          }

          reverse_proxy /* web:3000
        }
        EOF
    depends_on:
      web: {condition: service_started}
      space: {condition: service_started}
      admin: {condition: service_started}
      live: {condition: service_started}
      api: {condition: service_started}
  web:
    image: makeplane/plane-frontend@sha256:95ce1418b7b92ba5ce64e6f6d8a1c8bf7ad664018786bd79fc40a2e5094cf0c5 # tag: v1.4.3
    depends_on:
      api: {condition: service_started}
  space:
    image: makeplane/plane-space@sha256:af9b955874a2ea44f5121bc669200074428081301f950a8e4eeaf1a140e98a88 # tag: v1.4.3
    depends_on:
      api: {condition: service_started}
  admin:
    image: makeplane/plane-admin@sha256:45c95253282508a6c8fc633926231d7c0da003275f09c492bc60ed3cdab83208 # tag: v1.4.3
    depends_on:
      api: {condition: service_started}
  live:
    image: makeplane/plane-live@sha256:30741b6d6552533ba3fa80c43a0282e2d6be7769f2840ce9792c1fdacdbce91e # tag: v1.4.3
    environment:
      API_BASE_URL: http://api:8000
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
    depends_on:
      api: {condition: service_started}
      plane-redis: {condition: service_started}
  # The API runs Plane's migrator first (a one-shot service upstream; every Harbor service restarts, so it lives
  # here), then its own start script, which waits for the migrations, registers the instance and creates the bucket.
  api:
    image: makeplane/plane-backend@sha256:9b75bf46cf4ffa94272a337450ab96a4577f2b81ceff00def11f5c71eb8dd743 # tag: v1.4.3
    command: [bash, -c, './bin/docker-entrypoint-migrator.sh && exec ./bin/docker-entrypoint-api.sh']
    environment:
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "0"
      AWS_REGION: ""
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      API_KEY_RATE_LIMIT: 60/minute
      WEBHOOK_ALLOWED_IPS: ""
      WEBHOOK_ALLOWED_HOSTS: ""
    depends_on:
      plane-db: {condition: service_healthy}
      plane-redis: {condition: service_started}
      plane-mq: {condition: service_started}
      plane-minio: {condition: service_started}
  worker:
    image: makeplane/plane-backend@sha256:9b75bf46cf4ffa94272a337450ab96a4577f2b81ceff00def11f5c71eb8dd743 # tag: v1.4.3
    command: [./bin/docker-entrypoint-worker.sh]
    environment:
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "0"
      AWS_REGION: ""
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      API_KEY_RATE_LIMIT: 60/minute
      WEBHOOK_ALLOWED_IPS: ""
      WEBHOOK_ALLOWED_HOSTS: ""
    depends_on:
      api: {condition: service_started}
  beat-worker:
    image: makeplane/plane-backend@sha256:9b75bf46cf4ffa94272a337450ab96a4577f2b81ceff00def11f5c71eb8dd743 # tag: v1.4.3
    command: [./bin/docker-entrypoint-beat.sh]
    environment:
      DEBUG: "0"
      GUNICORN_WORKERS: "1"
      USE_MINIO: "1"
      MINIO_ENDPOINT_SSL: "0"
      AWS_REGION: ""
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: uploads
      FILE_SIZE_LIMIT: "5242880"
      REDIS_HOST: plane-redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://plane-redis:6379/
      API_KEY_RATE_LIMIT: 60/minute
      WEBHOOK_ALLOWED_IPS: ""
      WEBHOOK_ALLOWED_HOSTS: ""
    depends_on:
      api: {condition: service_started}
  plane-db:
    image: postgres@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984 # tag: 15.19-alpine
    command: [postgres, -c, max_connections=1000]
    environment:
      POSTGRES_USER: plane
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    volumes:
      - {type: volume, source: pgdata, target: /var/lib/postgresql/data}
    healthcheck:
      test: [CMD, pg_isready, -U, plane, -d, plane]
      interval: 5s
      timeout: 5s
      retries: 30
  # A cache only: nothing kept across restarts (Plane's queue is RabbitMQ, sessions live in Postgres).
  plane-redis:
    image: valkey/valkey@sha256:f8c1a646f4b31ae4dc3980ff06723a20b533ea1123b9796d450d78ed53ad6d3e # tag: 7.2.15-alpine
    command: [valkey-server, --save, "", --appendonly, "no"]
  plane-mq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281 # tag: 3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - {type: volume, source: rabbitmq-data, target: /var/lib/rabbitmq}
  plane-minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 # tag: RELEASE.2026-08-04T00-00-00Z
    command: [server, /export, --console-address, ":9090"]
    volumes:
      - {type: volume, source: uploads, target: /export}
volumes:
  pgdata: {}
  rabbitmq-data: {}
  uploads: {}
