services:
  db:
    image: postgres@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f # tag: 17.11
    environment:
      POSTGRES_USER: "nextcloud"
      POSTGRES_DB: "nextcloud"
    healthcheck:
      test: [CMD, pg_isready, -U, nextcloud, -d, nextcloud]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: /var/lib/postgresql/data}
  redis:
    image: redis@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537 # tag: 8.10.3-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    image: nextcloud@sha256:393d46e80fc241374a1b69064408cf0d54476580d7a00eb74cae3f4f2b2bb8a0 # tag: 34.0.5-apache
    environment:
      POSTGRES_HOST: "db"
      POSTGRES_DB: "nextcloud"
      POSTGRES_USER: "nextcloud"
      REDIS_HOST: "redis"
      PHP_MEMORY_LIMIT: "1G"
      PHP_UPLOAD_LIMIT: "16G"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - {type: volume, source: html, target: /var/www/html}
      - {type: volume, source: data, target: /var/www/html/data}
volumes:
  data: {}
  db: {}
  html: {}
