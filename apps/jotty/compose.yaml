services:
  web:
    image: ghcr.io/fccview/jotty@sha256:4face8fd1049d1ec3813f3da949d69fb68703f0f8421902a7a2de8ba3f1d61a6 # tag: 1.30.0
    environment:
      NODE_ENV: production
    volumes:
      - {type: volume, source: app, target: "/app/data"}
      - {type: volume, source: config, target: "/app/config"}
      - {type: volume, source: cache, target: "/app/.next/cache"}
volumes:
  app: {}
  config: {}
  cache: {}
