services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:b07c6c1bd705729e51838a2fa7205bc037db1ab0474f52e2def16009c5fa68d3 # tag: v3.56.1
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
