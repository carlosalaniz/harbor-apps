services:
  ollama:
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429 # tag: 0.40.13
    # The server settings (context length, keep-alive, parallel requests, ...) are manifest settings.
    # OLLAMA_IGPU_ENABLE admits integrated Intel/AMD graphics (Vulkan), which Ollama drops by default; it does not
    # change a discrete NVIDIA card. Vulkan itself is on by default in this release.
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - {type: volume, source: data, target: "/root/.ollama"}
volumes:
  data: {}
