services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:26b32b936aa6b2a3316fa1a02e486b62ff5c262505ab15c285c603a553da71e9 # tag: v3.51.2
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
