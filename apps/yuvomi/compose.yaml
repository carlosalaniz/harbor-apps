services:
  web:
    image: ghcr.io/ulsklyc/yuvomi@sha256:530a6fdff7602d80f1a4b96b5071af5e65e6beaa1333a534650276f5c0e92887 # tag: 2.93.0
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECURE: "false"
    volumes:
      - {type: volume, source: app, target: "/data"}
      - {type: volume, source: backups, target: "/backups"}
volumes:
  app: {}
  backups: {}
