services:
  web:
    image: ghost@sha256:abfa44b1827e514bce3ef1f5e1471bb7c7fd885d9e6316cd648a8b8b883808f0 # tag: 6.79.0
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: umbrel
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - {type: volume, source: content, target: "/var/lib/ghost/content"}
  db:
    image: mysql@sha256:8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00 # tag: 8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: umbrel
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, --silent]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db, target: "/var/lib/mysql"}
volumes:
  content: {}
  db: {}
