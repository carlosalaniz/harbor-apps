services:
  app:
    image: ghcr.io/carlosalaniz/crossbar-app@sha256:f2d92c8429c6bceb27f9bdd16229603d437404d84f991f669f6216588018c8b7 # tag: 0.1.1
    environment:
      CROSSBAR_BROWSER_URL: http://browser:9300
      CROSSBAR_DATA: /data
    volumes:
      - {type: volume, source: app-data, target: /data}
    depends_on:
      browser:
        condition: service_started
  browser:
    image: ghcr.io/carlosalaniz/crossbar-browser@sha256:0c237d76b32bb0e5c8807c03ecb4575c24befc4de3267487a08c570afc822bac # tag: 0.1.1
    environment:
      CROSSBAR_PROXY: http://proxy:3128
      CROSSBAR_PROFILES: /profiles
    volumes:
      - {type: volume, source: profiles, target: /profiles}
    depends_on:
      proxy:
        condition: service_started
  proxy:
    image: ghcr.io/carlosalaniz/crossbar-proxy@sha256:894c243fa285c29f32057764e82335745880a39c5f799394669685ed21263efc # tag: 0.1.1
volumes:
  app-data: {}
  profiles: {}
