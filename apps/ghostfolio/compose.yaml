services:
  db:
    # PostgreSQL 15, the version upstream's own compose file runs
    image: postgres@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8 # tag: 15.19-alpine
    environment:
      POSTGRES_DB: "ghostfolio"
      POSTGRES_USER: "ghostfolio"
    healthcheck:
      # Over TCP: the temporary server of the first initialisation only listens on its socket
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, ghostfolio, -d, ghostfolio]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - {type: volume, source: db-data, target: /var/lib/postgresql/data}
  redis:
    # Cache and job queues only: nothing in it is real data, so it never persists
    image: redis@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80 # tag: 8.10.3-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: ghostfolio/ghostfolio@sha256:899698d95d07c9665c082e5db4e54d8f81c0686ed2ffa9c24d8021e9b5b7c646 # tag: 3.98.0
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # Every start runs the Prisma CLI through npx (migrate, seed): no usage telemetry to
      # checkpoint.prisma.io, and no npm version check against the registry
      CHECKPOINT_DISABLE: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    # No container healthcheck: the first start migrates the database for a while, and Harbor's own
    # check of /api/v1/health (manifest health:) waits for it
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  db-data: {}
