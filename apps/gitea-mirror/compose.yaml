services:
  web:
    image: ghcr.io/raylabshq/gitea-mirror@sha256:4c6c9a1c379060385ed1d0bc5dfd44108b8d4683c58c3b35597649b2b79e180e # tag: v3.53.0
    environment:
      BETTER_AUTH_TRUSTED_ORIGINS: "*"
      NODE_ENV: production
      DATABASE_URL: file:data/gitea-mirror.db
      HOST: 0.0.0.0
      PORT: "4321"
      MIRROR_ISSUE_CONCURRENCY: "3"
      MIRROR_PULL_REQUEST_CONCURRENCY: "5"
    volumes:
      - {type: volume, source: data, target: "/app/data"}
    healthcheck:
      disable: true
volumes:
  data: {}
