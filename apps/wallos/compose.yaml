services:
  server:
    image: bellamy/wallos@sha256:b12fc3f6456fa4879346d27f13c96011a1dce8d5285ef31fcec9323f2bac9854 # tag: 5.10.1
    environment:
      TZ: Etc/UTC
      PUID: "1000"
      PGID: "1000"
    volumes:
      - {type: volume, source: db, target: "/var/www/html/db"}
      - {type: volume, source: logos, target: "/var/www/html/images/uploads/logos"}
    healthcheck:
      disable: true
volumes:
  db: {}
  logos: {}
