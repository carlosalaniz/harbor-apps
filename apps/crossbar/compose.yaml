services:
  app:
    image: ghcr.io/carlosalaniz/crossbar-app@sha256:456b9f463df405a5351b888318e30634f1aa3d48ef67f4b4b87b8d2a53270a59 # tag: 0.1.5
    environment:
      CROSSBAR_BROWSER_URL: http://browser:9300
      CROSSBAR_DATA: /data
      # CROSSBAR_PROFILE (default | nino) is the manifest's `profile` setting: Harbor sets it, so it is not set here.
    volumes:
      - {type: volume, source: app-data, target: /data}
    depends_on:
      browser:
        condition: service_started
  browser:
    image: ghcr.io/carlosalaniz/crossbar-browser@sha256:ee4be49ad70cef06d9c57a1a3902c76a3e9fd35080e3277e2723a6bf7cfeac7b # tag: 0.1.5
    environment:
      CROSSBAR_PROXY: http://proxy:3128
      CROSSBAR_PROFILES: /profiles
    volumes:
      - {type: volume, source: profiles, target: /profiles}
    depends_on:
      proxy:
        condition: service_started
  proxy:
    image: ghcr.io/carlosalaniz/crossbar-proxy@sha256:ddf8607c14203687b88ff617b4a78b09872689969a002eb523add051b5143713 # tag: 0.1.5
volumes:
  app-data: {}
  profiles: {}
